<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>

<div id="gallery">

  <svg id="wire" viewBox="0 0 120 12" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 10 Q60 2 112 10" fill="none" stroke="#aaa" stroke-width="1"/>
    <circle cx="60" cy="2" r="2.5" fill="#aaa"/>
  </svg>

  <div id="frame-wrap">
    <div id="frame">
      <div id="scene"></div>
    </div>
  </div>

  <div id="label">
    <span class="title">Karma</span>
    <span class="meta">Interactive, 2026 &nbsp;·&nbsp; SVG, HTML, JS</span>
  </div>

</div>

<script type="module">
  import { buildScene } from './js/scene.js';
  import './js/sound.js';
  import './js/noise.js';
  import './js/interaction.js';
  import './js/animation.js';

  const container = document.getElementById('scene');
  await buildScene(container);

  function scaleFrame() {
    const wrap   = document.getElementById('frame-wrap');
    const label  = document.getElementById('label');
    const wire   = document.getElementById('wire');

    const frameW = 1455 + 28 + 4;  // scene + padding + border
    const frameH = 1087 + 28 + 4;
    const labelH = label.offsetHeight + 14;
    const wireH  = wire.offsetHeight + 4;
    const gap    = 60; // breathing room around frame

    const availW = window.innerWidth  - gap * 2;
    const availH = window.innerHeight - labelH - wireH - gap * 2 - 24; // 24 = baseboard

    const scale  = Math.min(availW / frameW, availH / frameH);
    wrap.style.transform = `scale(${scale})`;

    // Shift the flex gap to account for scale shrinkage
    const scaledH = frameH * scale;
    const totalH  = wireH + scaledH + labelH;
    const marginTop = Math.max(0, (window.innerHeight - totalH - 24) / 2 - gap / 2);
    document.getElementById('gallery').style.paddingTop = marginTop + 'px';
  }

  // Wait for fonts + layout before scaling
  setTimeout(scaleFrame, 150);
  window.addEventListener('resize', scaleFrame);

  window.dispatchEvent(new Event('scene-ready'));
</script>

</body>
</html>
