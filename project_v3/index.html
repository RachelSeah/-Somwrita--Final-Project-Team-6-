<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>

<div id="gallery">

  <!-- Hanging wire -->
  <svg id="wire" viewBox="0 0 160 14" xmlns="http://www.w3.org/2000/svg">
    <path d="M10 12 Q80 2 150 12" fill="none" stroke="#aaa" stroke-width="1"/>
    <circle cx="80" cy="2" r="3" fill="#aaa"/>
  </svg>

  <!-- Frame wraps scene, scaled to fit screen -->
  <div id="frame-wrap">
    <div id="frame">
      <div id="scene"></div>
    </div>
  </div>

  <!-- Gallery label -->
  <div id="label">
    <span class="title">Karma</span>
    <span class="meta">Interactive, 2026 &nbsp;·&nbsp; SVG, HTML, JS</span>
  </div>

</div>

<script type="module">
  import { buildScene } from './js/scene.js';
  import './js/sound.js';
  import './js/noise.js';
  import './js/interaction.js';
  import './js/animation.js';

  const container = document.getElementById('scene');
  await buildScene(container);

  // Scale the frame to fit the screen with padding for the wall
  function scaleFrame() {
    const wrap      = document.getElementById('frame-wrap');
    const label     = document.getElementById('label');
    const wire      = document.getElementById('wire');
    const frameEl   = document.getElementById('frame');
    const padding   = 16 * 2; // frame padding each side
    const frameW    = 1455 + padding + 4; // scene + frame border
    const frameH    = 1087 + padding + 4;
    const labelH    = label.offsetHeight + 18; // label + gap
    const wireH     = wire.offsetHeight;
    const wallW     = window.innerWidth  * 0.82;
    const wallH     = (window.innerHeight - 28) * 0.82 - labelH - wireH;
    const scale     = Math.min(wallW / frameW, wallH / frameH);
    wrap.style.transform = `scale(${scale})`;
    // Keep total vertical layout centred
    const totalH = (frameH * scale) + labelH + wireH;
    document.getElementById('gallery').style.gap = '0';
  }

  scaleFrame();
  window.addEventListener('resize', scaleFrame);

  window.dispatchEvent(new Event('scene-ready'));
</script>

</body>
</html>
